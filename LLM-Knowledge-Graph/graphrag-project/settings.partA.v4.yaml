### Part A v4 (Education verification) config.
### - Clean-slate iteration focusing on **CMOC-shape** and **evidence-local** edges.
### - Strict: typed constructs only; OUTCOME is sink by default.
###
### Required env vars (set by scripts/partA_run_graphrag_v4.ps1):
###   PARTA_INPUT_DIR
###   PARTA_OUTPUT_DIR
###   PARTA_CACHE_DIR
###   PARTA_LOG_DIR
###   PARTA_LANCEDB_DIR
###

models:
  default_chat_model:
    type: chat
    model_provider: openai
    auth_type: api_key
    api_key: ${OPENAI_API_KEY}
    model: gpt-4o
    model_supports_json: true
    request_timeout: 900
    concurrent_requests: 1
    async_mode: threaded
    retry_strategy: exponential_backoff
    max_retries: 10
    # Throttle to reduce 429 TPM bursts on long indexing runs.
    # Keep below your org limit (see OpenAI rate limits page).
    tokens_per_minute: 24000
    requests_per_minute: 60

  cheap_chat_model:
    type: chat
    model_provider: openai
    auth_type: api_key
    api_key: ${OPENAI_API_KEY}
    model: gpt-4o-mini
    model_supports_json: true
    request_timeout: 900
    concurrent_requests: 1
    async_mode: threaded
    retry_strategy: exponential_backoff
    max_retries: 10
    # Throttle cheap high-volume steps too (claims/community reports).
    tokens_per_minute: 24000
    requests_per_minute: 60

  default_embedding_model:
    type: embedding
    model_provider: openai
    auth_type: api_key
    api_key: ${OPENAI_API_KEY}
    model: text-embedding-3-small
    request_timeout: 300
    concurrent_requests: 1
    async_mode: threaded
    retry_strategy: exponential_backoff
    max_retries: 10
    tokens_per_minute: 24000
    requests_per_minute: 60

input:
  storage:
    type: file
    base_dir: ${PARTA_INPUT_DIR}
  file_type: text

chunks:
  # v4: slightly smaller chunks to help evidence-local extraction.
  size: 1000
  overlap: 80
  group_by_columns: [id]

output:
  type: file
  base_dir: ${PARTA_OUTPUT_DIR}

cache:
  type: file
  base_dir: ${PARTA_CACHE_DIR}

reporting:
  type: file
  base_dir: ${PARTA_LOG_DIR}

vector_store:
  default_vector_store:
    type: lancedb
    db_uri: ${PARTA_LANCEDB_DIR}
    container_name: default

embed_text:
  model_id: default_embedding_model
  vector_store_id: default_vector_store

extract_graph:
  # v4: use stronger model to reduce schema/direction errors.
  model_id: default_chat_model
  prompt: "prompts_partA_v4/extract_graph.txt"
  entity_types:
    - intervention
    - comparator
    - learner_population
    - learner_context
    - cognitive_state
    - motivation_affect
    - setting_context
    - context
    - mechanism
    - outcome
    - clinical_domain
    - study_design
  max_gleanings: 1

summarize_descriptions:
  model_id: cheap_chat_model
  prompt: "prompts/summarize_descriptions.txt"
  max_length: 500

extract_graph_nlp:
  text_analyzer:
    extractor_type: regex_english
  async_mode: threaded

cluster_graph:
  max_cluster_size: 25

extract_claims:
  enabled: true
  model_id: cheap_chat_model
  prompt: "prompts_partA_v4/extract_claims.txt"
  description: "v4: evidence-local realist claims with mandatory [PAGE N] snippet."
  max_gleanings: 1

community_reports:
  model_id: cheap_chat_model
  graph_prompt: "prompts/community_report_graph.txt"
  text_prompt: "prompts/community_report_text.txt"
  max_length: 2000
  max_input_length: 8000

embed_graph:
  enabled: false

umap:
  enabled: false

snapshots:
  graphml: false
  embeddings: false

local_search:
  chat_model_id: default_chat_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/local_search_system_prompt.txt"

global_search:
  chat_model_id: default_chat_model
  map_prompt: "prompts/global_search_map_system_prompt.txt"
  reduce_prompt: "prompts/global_search_reduce_system_prompt.txt"
  knowledge_prompt: "prompts/global_search_knowledge_system_prompt.txt"

drift_search:
  chat_model_id: default_chat_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/drift_search_system_prompt.txt"
  reduce_prompt: "prompts/drift_reduce_prompt.txt"

basic_search:
  chat_model_id: default_chat_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/basic_search_system_prompt.txt"

