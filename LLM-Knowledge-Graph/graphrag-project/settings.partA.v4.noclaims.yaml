### Part A v4 (NO-CLAIMS) config.
### - Fast iteration mode: focus on entity/relationship quality (CMOC shape).
### - Disables extract_claims/extract_covariates to avoid long LLM-heavy steps.
###

models:
  default_chat_model:
    type: chat
    model_provider: openai
    auth_type: api_key
    api_key: ${OPENAI_API_KEY}
    model: gpt-4o
    model_supports_json: true
    request_timeout: 900
    concurrent_requests: 1
    async_mode: threaded
    retry_strategy: exponential_backoff
    max_retries: 10
    tokens_per_minute: null
    requests_per_minute: null

  cheap_chat_model:
    type: chat
    model_provider: openai
    auth_type: api_key
    api_key: ${OPENAI_API_KEY}
    model: gpt-4o-mini
    model_supports_json: true
    request_timeout: 900
    concurrent_requests: 1
    async_mode: threaded
    retry_strategy: exponential_backoff
    max_retries: 10
    tokens_per_minute: null
    requests_per_minute: null

  default_embedding_model:
    type: embedding
    model_provider: openai
    auth_type: api_key
    api_key: ${OPENAI_API_KEY}
    model: text-embedding-3-small
    request_timeout: 300
    concurrent_requests: 1
    async_mode: threaded
    retry_strategy: exponential_backoff
    max_retries: 10
    tokens_per_minute: null
    requests_per_minute: null

input:
  storage:
    type: file
    base_dir: ${PARTA_INPUT_DIR}
  file_type: text

chunks:
  size: 1000
  overlap: 80
  group_by_columns: [id]

output:
  type: file
  base_dir: ${PARTA_OUTPUT_DIR}

cache:
  type: file
  base_dir: ${PARTA_CACHE_DIR}

reporting:
  type: file
  base_dir: ${PARTA_LOG_DIR}

vector_store:
  default_vector_store:
    type: lancedb
    db_uri: ${PARTA_LANCEDB_DIR}
    container_name: default

embed_text:
  model_id: default_embedding_model
  vector_store_id: default_vector_store

extract_graph:
  model_id: default_chat_model
  prompt: "prompts_partA_v4/extract_graph.txt"
  entity_types:
    - intervention
    - comparator
    - learner_population
    - learner_context
    - cognitive_state
    - motivation_affect
    - setting_context
    - context
    - mechanism
    - outcome
    - clinical_domain
    - study_design
  max_gleanings: 1

summarize_descriptions:
  model_id: cheap_chat_model
  prompt: "prompts/summarize_descriptions.txt"
  max_length: 500

extract_graph_nlp:
  text_analyzer:
    extractor_type: regex_english
  async_mode: threaded

cluster_graph:
  max_cluster_size: 25

extract_claims:
  enabled: false

community_reports:
  model_id: cheap_chat_model
  graph_prompt: "prompts/community_report_graph.txt"
  text_prompt: "prompts/community_report_text.txt"
  max_length: 2000
  max_input_length: 8000

embed_graph:
  enabled: false

umap:
  enabled: false

snapshots:
  graphml: false
  embeddings: false

local_search:
  chat_model_id: default_chat_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/local_search_system_prompt.txt"

global_search:
  chat_model_id: default_chat_model
  map_prompt: "prompts/global_search_map_system_prompt.txt"
  reduce_prompt: "prompts/global_search_reduce_system_prompt.txt"
  knowledge_prompt: "prompts/global_search_knowledge_system_prompt.txt"

drift_search:
  chat_model_id: default_chat_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/drift_search_system_prompt.txt"
  reduce_prompt: "prompts/drift_reduce_prompt.txt"

basic_search:
  chat_model_id: default_chat_model
  embedding_model_id: default_embedding_model
  prompt: "prompts/basic_search_system_prompt.txt"

