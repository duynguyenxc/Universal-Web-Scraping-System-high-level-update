[project]
name = "llm-kg"
version = "0.1.0"
description = "LLM-assisted domain knowledge graph + literature review pipeline (subproject of UWSS repo)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.9",
  "PyYAML>=6.0",
  "rich>=13.9",
]

[project.scripts]
llm-kg = "llm_kg.cli:main"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_kg"]


